{% extends "base.html" %}
{% block title %}Register — PocketSmart AI{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form id="registerForm" class="form-card">
    <span class="eyebrow">POCKETSMART AI</span>
    <h1>Create your account</h1>
    <p class="muted">Save recommendation history and continue plans later.</p>
    <label>Name<input name="name" required minlength="2" autocomplete="name"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn full" type="submit">Create account</button>
    <div id="formError" class="error"></div>
    <p class="center">Already registered? <a href="/login">Sign in</a></p>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script>
document.querySelector("#registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const res = await fetch("/register", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
  const body = await res.json();
  if (!res.ok) { document.querySelector("#formError").textContent = body.detail || "Registration failed."; return; }
  location.href = "/dashboard";
});
</script>
{% endblock %}
